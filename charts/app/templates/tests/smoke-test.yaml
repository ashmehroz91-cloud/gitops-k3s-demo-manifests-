apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    "helm.sh/hook": test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.2.1
          command: ["sh","-c","curl -sS http://backend.default.svc.cluster.local:8080/health | grep -q 'The backend is up'"]
